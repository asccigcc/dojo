default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      # Short poll so a Run press is picked up quickly.
      polling_interval: 0.2

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
