# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

AllCops:
  Exclude:
    # Exercise content (kit tests, reference solutions, warm-up data) is
    # copied verbatim from the practice kit and is learner-facing material,
    # not application code. Restyling it would drift from the source.
    - "content/**/*"
    - "node_modules/**/*"
    - "vendor/**/*"
    - "db/*schema.rb"
