title: 'G9 · From a copy of totals (rep A5), delete "cy": what''s...'
prompt: 'From a copy of `totals` (rep A5), delete `"cy"`: what''s returned and what''s left? Then, without changing `totals`, drop patients under 2000 cents.'
returns: Return `[deleted_value, copy_after_delete, filtered]`.
setup: totals = FILLS.each_with_object(Hash.new(0)) { |f, h| h[f[:patient]] += f[:cents] }
expected: '[1200, { "ana" => 2700, "ben" => 2000 }, { "ana" => 2700, "ben" => 2000 }]'
answer: |-
  copy = totals.dup
  gone = copy.delete("cy")
  [gone, copy, totals.reject { |_, c| c < 2000 }]
